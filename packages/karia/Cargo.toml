[package]
name = "karia"
version = "0.0.2"
edition = "2024"
license = "MIT"
description = "Query CSS custom properties and CSS Modules using a Rust analysis engine"
repository = "https://github.com/toyamarinyon/karia"

[dependencies]
cssparser = "0.35"
ignore = "0.4.33"
oxc_allocator = "0.149.0"
oxc_ast = "0.149.0"
oxc_ast_visit = "0.149.0"
oxc_parser = "0.149.0"
oxc_semantic = "0.149.0"
oxc_span = "0.149.0"
oxc_syntax = "0.149.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
