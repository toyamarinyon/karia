[package]
name = "karia"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Query CSS custom properties and CSS Modules using a Rust analysis engine"
repository = "https://github.com/toyamarinyon/karia"

[dependencies]
ignore = "0.4.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27"
tree-sitter-css = "0.25"

[dev-dependencies]
tempfile = "3"
