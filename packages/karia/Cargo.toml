[package]
name = "karia"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Query CSS custom properties and CSS Modules using a Rust analysis engine"
repository = "https://github.com/toyamarinyon/karia"

[dependencies]
cssparser = "0.35"
ignore = "0.4.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
