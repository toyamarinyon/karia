id = "karia"
name = "Karia"
version = "0.0.2"
schema_version = 1
authors = ["Karia"]
description = "Zed extension for the karia CSS language server."
repository = "https://github.com/toyamarinyon/karia"
capabilities = [{ kind = "npm:install", package = "karia-lsp" }]

[language_servers.karia]
name = "karia"
languages = ["CSS", "TSX", "TypeScript", "JavaScript"]

[language_servers.karia.language_ids]
CSS = "css"
TSX = "typescriptreact"
TypeScript = "typescript"
JavaScript = "javascript"
